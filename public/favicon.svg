<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4E0"/>
      <stop offset="1" stop-color="#FCE4B6"/>
    </linearGradient>
    <linearGradient id="outer" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#F15A22"/>
      <stop offset="0.55" stop-color="#E8930C"/>
      <stop offset="1" stop-color="#C43217"/>
    </linearGradient>
    <linearGradient id="inner" x1="0.5" y1="0.2" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.7" stop-color="#F15A22"/>
      <stop offset="1" stop-color="#C43217"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.75" r="0.45">
      <stop offset="0" stop-color="#FFF1B8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFF1B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cream rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Outer flame: tall asymmetric teardrop with curl -->
  <path d="
    M 33 6
    C 27 14 36 21 32 30
    C 34 28 38 28 40 32
    C 42 36 41 41 38 43
    C 42 41 47 43 49 48
    C 51 54 47 60 36 60
    C 22 60 14 53 16 46
    C 17 41 22 39 25 41
    C 27 38 26 33 28 30
    C 30 26 33 24 30 18
    C 28 13 32 10 33 6
    Z" fill="url(#outer)"/>

  <!-- Inner flame core -->
  <path d="
    M 32 28
    C 30 33 35 35 33 41
    C 35 39 38 41 39 45
    C 40 50 36 55 32 55
    C 27 55 23 51 24 46
    C 25 42 28 41 30 43
    C 30 38 33 34 32 28
    Z" fill="url(#inner)"/>

  <!-- Hot spot glow -->
  <ellipse cx="32" cy="50" rx="8" ry="6" fill="url(#glow)"/>
</svg>
